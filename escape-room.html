<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Health Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#071426;color:#fff}
:root{--cyan:#5ff3ff;--lime:#9cff72;--pink:#ff6fae;--yellow:#ffd85b}
button{font:inherit}
#app{width:100vw;height:100vh;position:relative;background:linear-gradient(180deg,#071426 0%,#0d2940 62%,#07121f 100%)}
#select{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 25%,#153e59aa,#06101dee 65%)}
.card{width:min(1100px,94vw);max-height:92vh;overflow:auto;background:#081827eF;border:2px solid #285a72;border-radius:30px;padding:30px;box-shadow:0 25px 100px #0009}
.kicker{font-weight:900;letter-spacing:4px;color:var(--cyan);font-size:12px}.logo{font-size:clamp(34px,7vw,78px);font-weight:1000;line-height:.9;margin:8px 0;text-shadow:0 5px 0 #12384a}.sub{color:#a9c5d2}.roster{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:24px 0}.char{background:#0c2436;color:#fff;border:2px solid #21495e;border-radius:18px;padding:8px 5px;min-height:118px;cursor:pointer;transition:.15s}.char:hover{transform:translateY(-4px);border-color:var(--cyan)}.char.sel{border-color:var(--yellow);box-shadow:0 0 0 3px #ffd85b33;background:#14374b}.avatar{height:65px;position:relative;width:54px;margin:auto}.avatar:before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;left:10px;top:4px;background:var(--skin);box-shadow:0 28px 0 3px var(--shirt)}.avatar:after{content:"";position:absolute;width:40px;height:22px;left:7px;top:0;border-radius:55% 55% 30% 30%;background:var(--hair)}.char b{display:block;font-size:12px;margin-top:7px}.start{border:0;background:linear-gradient(135deg,#16b9c8,#08798f);color:white;font-weight:1000;padding:16px 28px;border-radius:15px;cursor:pointer;box-shadow:0 10px 30px #00d9ff33}.start:hover{transform:translateY(-2px)}
#game{display:none;position:absolute;inset:0}.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#06121eee,#06121e00);pointer-events:none}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#071827cc;border:1px solid #32637b;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}.mission{color:var(--cyan)}#scene{position:absolute;inset:0;overflow:hidden}.sky{position:absolute;inset:0;background:linear-gradient(#08172c 0%,#0c3650 55%,#0b1d2b 100%)}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:70px 70px;opacity:.18}.city{position:absolute;left:-10%;right:-10%;bottom:30%;height:35%;background:linear-gradient(90deg,#102a3a 10%,#173e50 10% 17%,#102a3a 17% 27%,#1b4658 27% 38%,#102a3a 38% 49%,#174253 49% 63%,#102a3a 63% 75%,#1c4a5a 75% 86%,#102a3a 86%);opacity:.8;transform:skewX(-3deg)}.city:after{content:"";position:absolute;inset:18% 0 0;background:repeating-linear-gradient(90deg,transparent 0 35px,#5ff3ff22 36px 39px,transparent 40px 70px)}.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:#07111d;border-top:3px solid #38d8df;box-shadow:0 -15px 60px #00d9ff1a}.road{position:absolute;left:0;right:0;bottom:4%;height:2px;background:repeating-linear-gradient(90deg,#ffd85b 0 90px,transparent 90px 170px);opacity:.5}
#world{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}.world{position:absolute;left:0;bottom:0;height:34%;width:4200px}.platform{position:absolute;background:linear-gradient(#15536a,#0b2c3e);border-top:4px solid #4ceef5;box-shadow:inset 0 12px 0 #ffffff08}.platform:after{content:"";position:absolute;inset:20px 0 0;background:repeating-linear-gradient(90deg,#0b2030 0 20px,#123c50 20px 42px)}.terminal{position:absolute;width:72px;height:62px;border:3px solid var(--cyan);background:#0a3042;border-radius:12px;box-shadow:0 0 35px #00eaff77}.terminal:before{content:"⚕";display:block;text-align:center;font-size:30px;color:var(--cyan);margin-top:5px}.terminal span{display:block;text-align:center;font-size:9px;font-weight:900;color:#fff}.chip{position:absolute;width:24px;height:24px;background:var(--yellow);transform:rotate(45deg);border-radius:5px;box-shadow:0 0 25px #ffd85b}.chip:after{content:"+";position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-45deg);font-weight:1000;color:#765900}.drone{position:absolute;width:42px;height:24px;border-radius:10px;background:#e14e78;box-shadow:0 0 18px #ff4f8888}.drone:before,.drone:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;top:7px}.drone:before{left:9px}.drone:after{right:9px}
.player{position:absolute;width:46px;height:72px;bottom:34%;z-index:3;filter:drop-shadow(0 8px 5px #0009);transition:transform .05s}.player .body{position:absolute;left:9px;top:27px;width:28px;height:33px;background:var(--shirt);border-radius:9px 9px 5px 5px}.player .head{position:absolute;left:12px;top:5px;width:22px;height:25px;border-radius:50%;background:var(--skin);z-index:2}.player .hair{position:absolute;left:9px;top:1px;width:28px;height:16px;border-radius:50% 50% 30% 30%;background:var(--hair);z-index:3}.player .eye{position:absolute;top:16px;width:3px;height:3px;background:#17202a;border-radius:50%;z-index:4}.player .e1{left:17px}.player .e2{left:25px}.player .leg{position:absolute;top:57px;width:10px;height:15px;background:#273b56;border-radius:4px}.player .l1{left:11px}.player .l2{left:26px}.player .name{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:900;text-shadow:0 2px 4px #000}.run .l1{animation:step .18s infinite alternate}.run .l2{animation:step .18s infinite alternate-reverse}@keyframes step{to{transform:translateY(-4px)}}
#prompt{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);z-index:8;background:#061522eF;border:2px solid var(--cyan);border-radius:15px;padding:10px 16px;font-weight:900;display:none;white-space:nowrap}.touch{position:absolute;bottom:18px;left:18px;z-index:9;display:flex;gap:8px}.touch button{width:58px;height:58px;border:1px solid #4c8096;background:#071b2bcc;color:#fff;border-radius:16px;font-size:24px}.touch .jump{background:#087f91}.bottom{position:absolute;right:18px;bottom:18px;z-index:9;display:flex;gap:8px}.small{border:1px solid #3c6d82;background:#071b2bcc;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}
.modal{display:none;position:absolute;inset:0;z-index:30;background:#020914dd;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.quiz{width:min(650px,92vw);background:#0b2032;border:2px solid var(--cyan);border-radius:24px;padding:24px;box-shadow:0 0 80px #00eaff33}.q{font-size:22px;font-weight:900;margin:10px 0 18px}.answers{display:grid;gap:10px}.ans{border:1px solid #3d7086;background:#102e43;color:#fff;border-radius:12px;padding:13px;text-align:left;cursor:pointer}.ans:hover{border-color:var(--cyan)}.feedback{min-height:25px;margin-top:12px;font-weight:900}.continue{display:none;margin-top:10px;border:0;background:var(--lime);color:#10250d;font-weight:1000;border-radius:12px;padding:13px 18px}.end{display:none;position:absolute;inset:0;z-index:40;background:#03101ddd;place-items:center;text-align:center}.end .box{background:#0b2436;border:2px solid var(--yellow);border-radius:25px;padding:35px;max-width:600px}.big{font-size:70px}
@media(max-width:850px){.roster{grid-template-columns:repeat(4,1fr)}.card{padding:20px}.logo{font-size:44px}.char{min-height:105px}.top{padding:8px}.pill{font-size:11px;padding:6px 9px}}
@media(max-width:500px){.roster{grid-template-columns:repeat(2,1fr)}.sub{font-size:13px}.card{max-height:95vh}.bottom{display:none}.touch{bottom:12px}}
</style>
</head>
<body>
<div id="app">
<section id="select">
<div class="card">
<div class="kicker">HEALTH & TECHNOLOGY • 2D ADVENTURE</div>
<div class="logo">NEON HEALTH<br>RUN</div>
<p class="sub">Run through the futuristic clinic, collect the medical chips and prove your Present Perfect skills.</p>
<div id="roster" class="roster"></div>
<button id="start" class="start">▶ START ADVENTURE</button>
</div>
</section>

<section id="game">
<div class="top"><div class="stats"><span class="pill">🧑 <b id="pname"></b></span><span class="pill">💊 <b id="chips">0/4</b></span><span class="pill">⭐ <b id="score">0</b></span><span class="pill">❤️ <b id="lives">3</b></span></div><span class="pill mission" id="mission">COLLECT ALL MEDICAL CHIPS</span></div>
<div id="scene"><div class="sky"></div><div class="stars"></div><div class="city"></div><div class="floor"></div><div class="road"></div><div id="world"></div><div id="player" class="player"><div class="name" id="pname2"></div><div class="hair"></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div></div></div>
<div id="prompt">Press E / INTERACT</div>
<div class="touch"><button id="left">◀</button><button id="right">▶</button><button id="jump" class="jump">⬆</button></div>
<div class="bottom"><button class="small" id="interact">E • INTERACT</button><button class="small" id="hint">💡 HINT</button></div>
</section>

<div id="quizModal" class="modal"><div class="quiz"><div class="kicker" id="qtitle">MEDICAL TERMINAL</div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="continue" id="continue">CONTINUE RUN →</button></div></div>
<div id="end" class="end"><div class="box"><div class="big" id="endIcon">🏆</div><h1 id="endTitle"></h1><p id="endText"></p><button class="start" id="again">PLAY AGAIN</button></div></div>
</div>
<script>
const people=[
["María José","#171313","#f0c7a5","#49a8d8"],["Natalia","#e5c36a","#f4d7bd","#e68bca"],["Kevin","#241812","#bd875f","#55c98b"],["Sebastián","#171313","#d5a17e","#5d75e8"],["Valentina","#241611","#f1c8a6","#ef6b6b"],["Laura","#b83d2d","#efc3a5","#8d72e8"],["Dallana","#b83d2d","#eac0a4","#47b8a4"],["Katherin","#171313","#eac5a8","#e6a33e"],["Paula","#67243b","#bd896b","#d95d83"],["Osana","#211711","#bd896b","#45a7c7"],["Daniela","#c84936","#efc3a5","#7fc85a"],["Ronald","#171313","#bd896b","#5579d9"],["Melissa","#39251e","#efc7a8","#c96ad7"],["John (Professor)","#171313","#684735","#4b9e9b"]];
const qs=[
["MEDICAL CHIP 1","The nurse _____ (check) the patient's temperature.",["have checked","has checked","has check"],1,"The nurse is singular: has + checked."],
["MEDICAL CHIP 2","Choose the correct sentence.",["The doctors has used the scanner.","The doctors have used the scanner.","The doctors have use the scanner."],1,"Doctors is plural: have + used."],
["MEDICAL CHIP 3","AI _____ (change) medical diagnosis.",["have changed","has changed","has change"],1,"AI is singular: has + changed."],
["MEDICAL CHIP 4","Choose the correct question.",["Have you ever used a health app?","Has you ever used a health app?","Have you ever use a health app?"],0,"With you: have + used."]
];
const roster=document.getElementById("roster");let selected=0;
people.forEach((p,i)=>{const b=document.createElement("button");b.className="char"+(i===0?" sel":"");b.innerHTML='<div class="avatar" style="--hair:'+p[1]+';--skin:'+p[2]+';--shirt:'+p[3]+'"></div><b>'+p[0]+'</b>';b.onclick=()=>{selected=i;document.querySelectorAll(".char").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};roster.appendChild(b)});
const world=document.getElementById("world"),player=document.getElementById("player");let x=90,v=0,vy=0,grounded=true,dir=1,cam=0,keys={},score=0,lives=3,got=0,paused=false,seconds=360,stations=[],raf;
const level=[
[0,470,620,70],[700,470,450,70],[1260,470,470,70],[1830,470,510,70],[2450,470,500,70],[3070,470,600,70],[3790,470,410,70],
[280,385,180,20],[850,355,160,20],[1120,400,90,20],[1370,365,170,20],[1710,315,140,20],[1970,380,180,20],[2250,330,140,20],[2620,370,180,20],[2890,305,140,20],[3200,365,180,20],[3480,310,150,20],[3720,380,150,20]];
function build(){world.innerHTML="";level.forEach(p=>{let e=document.createElement("div");e.className="platform";e.style.cssText=`left:${p[0]}px;bottom:${p[1]-70}px;width:${p[2]}px;height:${p[3]}px`;world.appendChild(e)});stations=[760,1600,2500,3350].map((x,i)=>{let e=document.createElement("div");e.className="terminal";e.style.left=(x-36)+"px";e.style.bottom="34%";e.innerHTML="<span>"+(i+1)+" • "+(i<3?"SCAN":"FINAL")+"</span>";world.appendChild(e);return {x,el:e,done:false,i}});[420,1030,1530,2920].forEach((x,i)=>{let e=document.createElement("div");e.className="chip";e.style.left=(x-12)+"px";e.style.bottom=(i===3? "55%":"41%");world.appendChild(e);e.dataset.i=i});[570,1190,2130,2780,3600].forEach((x,i)=>{let e=document.createElement("div");e.className="drone";e.style.left=x+"px";e.style.bottom=(i%2?"48%":"38%");world.appendChild(e)})}
function start(){document.getElementById("select").style.display="none";document.getElementById("game").style.display="block";document.documentElement.requestFullscreen?.().catch(()=>{});x=90;v=0;vy=0;score=0;lives=3;got=0;seconds=360;paused=false;stations.forEach(s=>s.done=false);const p=people[selected];player.style.setProperty("--hair",p[1]);player.style.setProperty("--skin",p[2]);player.style.setProperty("--shirt",p[3]);document.getElementById("pname").textContent=p[0];document.getElementById("pname2").textContent=p[0];hud();build();clearInterval(window.t);window.t=setInterval(()=>{if(!paused){seconds--;if(seconds<=0)finish(false)}},1000);cancelAnimationFrame(raf);loop()}
function hud(){document.getElementById("chips").textContent=got+"/4";document.getElementById("score").textContent=score;document.getElementById("lives").textContent=lives;document.getElementById("mission").textContent=got<4?"COLLECT ALL MEDICAL CHIPS":"REACH THE EMERGENCY EXIT";document.title="Neon Health Run • "+String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}
function solid(px,py){return level.some(p=>px+40>p[0]&&px<p[0]+p[2]&&py+72>p[1]&&py+72<p[1]+16)}
function loop(){if(!paused){let L=keys.ArrowLeft||keys.a,R=keys.ArrowRight||keys.d;if(L){v=Math.max(v-.55,-6);dir=-1}if(R){v=Math.min(v+.55,6);dir=1}if(!L&&!R)v*=.82;vy+=.65;let nx=x+v;if(nx>=0&&nx<4160)x=nx;let ny=player.offsetTop+vy;let base=470;let hit=470;level.forEach(p=>{if(x+38>p[0]&&x<p[0]+p[2]&&player.offsetTop+72<=p[1]+8&&ny+72>=p[1])hit=Math.min(hit,p[1])});if(ny+72>=hit){player.style.top="";player.style.bottom=(540-hit-72)+"px";vy=0;grounded=true}else{player.style.bottom=(540-ny-72)+"px";grounded=false}if(player.offsetTop>650){lives--;x=Math.max(80,x-250);if(lives<=0)return finish(false);hud()}if(Math.abs(v)>.4)player.classList.add("run");else player.classList.remove("run");player.style.left=(x-cam)+"px";player.style.transform=dir<0?"scaleX(-1)":"scaleX(1)";cam=Math.max(0,Math.min(3340,x-300));world.style.transform="translateX(-"+cam+"px)";document.querySelector(".city").style.transform="translateX("+(-cam*.08)+"px) skewX(-3deg)";collect();checkPrompt();}raf=requestAnimationFrame(loop)}
function collect(){document.querySelectorAll(".chip").forEach(e=>{if(e.style.display==="none")return;let cx=parseFloat(e.style.left)+12;if(Math.abs(cx-x-18)<30){e.style.display="none";got++;score+=50;hud()}})}
function checkPrompt(){let s=stations.find(s=>!s.done&&Math.abs(s.x-x)<75);document.getElementById("prompt").style.display=s?"block":"none"}
function jump(){if(!paused&&grounded){vy=-13;grounded=false}}
function interact(){let s=stations.find(s=>!s.done&&Math.abs(s.x-x)<85);if(s)openQuiz(s);else document.getElementById("mission").textContent=got<4?"Get close to a glowing terminal.":"Run to the emergency exit!"}
function openQuiz(s){paused=true;const q=qs[s.i];document.getElementById("qtitle").textContent=q[0];document.getElementById("question").textContent=q[1];const a=document.getElementById("answers");a.innerHTML="";document.getElementById("feedback").textContent="";document.getElementById("continue").style.display="none";q[2].forEach((v,i)=>{let b=document.createElement("button");b.className="ans";b.textContent=String.fromCharCode(65+i)+". "+v;b.onclick=()=>answer(s,q,i);a.appendChild(b)});document.getElementById("quizModal").classList.add("open")}
function answer(s,q,i){document.querySelectorAll(".ans").forEach(b=>b.disabled=true);const f=document.getElementById("feedback");if(i===q[3]){s.done=true;got=Math.max(got,stations.filter(z=>z.done).length);score+=100;f.style.color="var(--lime)";f.textContent="✓ Correct! "+q[4];document.getElementById("continue").style.display="inline-block";hud()}else{f.style.color="#ff91aa";f.textContent="✗ Try again. "+q[4];let b=document.createElement("button");b.className="ans";b.textContent="TRY AGAIN";b.onclick=()=>{document.getElementById("quizModal").classList.remove("open");paused=false;openQuiz(s)};document.getElementById("answers").appendChild(b)}}
document.getElementById("continue").onclick=()=>{document.getElementById("quizModal").classList.remove("open");paused=false};
function finish(win){paused=true;clearInterval(window.t);document.getElementById("end").style.display="grid";document.getElementById("endIcon").textContent=win?"🏆":"💥";document.getElementById("endTitle").textContent=win?"FACILITY ESCAPED!":"GAME OVER";document.getElementById("endText").textContent=win?"Amazing, "+people[selected][0]+"! You mastered the Present Perfect and escaped with "+score+" points.":"The facility locked down. Try again and collect all four chips.";cancelAnimationFrame(raf)}
document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowLeft","ArrowRight","ArrowUp"," ","a","d","w"].includes(e.key))e.preventDefault();if(["ArrowUp","w"," "].includes(e.key)&&!e.repeat)jump();if(e.key.toLowerCase()==="e")interact()});document.addEventListener("keyup",e=>keys[e.key]=false);
function hold(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=()=>keys[k]=false;b.onpointerleave=()=>keys[k]=false}
hold("left","ArrowLeft");hold("right","ArrowRight");document.getElementById("jump").onclick=jump;document.getElementById("interact").onclick=interact;document.getElementById("hint").onclick=()=>{seconds=Math.max(0,seconds-15);document.getElementById("mission").textContent="Hint: glowing terminals are your checkpoints.";};document.getElementById("start").onclick=start;document.getElementById("again").onclick=()=>{document.getElementById("end").style.display="none";start()};
</script>
</body>
</html>
